name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        env:
          VITE_WORKER_URL: https://runway-radar-api.isingingbanana.workers.dev
          VITE_MAPBOX_TOKEN: pk.eyJ1Ijoia2llcmFuMDEiLCJhIjoiY21wZWRnOGIwMDRnMjJwcjNnNHY2ZDRoeiJ9.bldXK-De2d5NYuw29rpsCw
          VITE_FIREBASE_API_KEY: AIzaSyD40AiQ6NJCHg9zTdyqgTa_g1eBCGZ9Yw4
          VITE_FIREBASE_AUTH_DOMAIN: runwayradar-b7289.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: runwayradar-b7289
          VITE_FIREBASE_APP_ID: 1:64762013131:web:0fa63c2ba0913e37a6024e
          VITE_USE_MOCK_DATA: true
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
